apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcare-app-ingress
  labels:
    app: healthcare-app
    app.kubernetes.io/name: healthcare-app
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: healthcare-appointment-system
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: healthcare.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthcare-app-service
                port:
                  number: 8080
